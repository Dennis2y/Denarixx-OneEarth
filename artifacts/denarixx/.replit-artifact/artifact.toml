kind = "web"
previewPath = "/"
title = "Denarixx OneEarth"
version = "1.0.0"
id = "artifacts/denarixx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22275
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/denarixx run dev"

[services.env]
PORT = "22275"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/denarixx", "run", "build"]
publicDir = "artifacts/denarixx/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
