name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/denarixx_oneearth
          PORT: 3001
          NODE_ENV: production

      - name: Build frontend
        run: pnpm --filter @workspace/denarixx run build
        env:
          PORT: 3002
          BASE_PATH: /
          VITE_API_URL: http://localhost:3001
          VITE_PORT: 3002
          NODE_ENV: production

